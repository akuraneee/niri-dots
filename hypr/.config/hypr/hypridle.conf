# Idle behaviour (timers count from the last keyboard/mouse input):
#   unlocked: suspend after 15 min (locked first, so waking up shows the lock screen)
#   locked:   monitors off after 30 s, suspend after 5 min

general {
    # hyprlock plus YubiKey unlock; also switches to the English layout
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

# Locked: monitors off
listener {
    timeout = 30
    on-timeout = pidof hyprlock && niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Locked: suspend
listener {
    timeout = 300
    on-timeout = pidof hyprlock && systemctl suspend
}

# Unlocked: lock and suspend
listener {
    timeout = 900
    on-timeout = ~/.config/niri/scripts/lock-suspend.sh
}
