general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 96
    color = rgba(255, 255, 255, 1.0)
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 22
    color = rgba(255, 255, 255, 0.8)
    position = 0, 110
    halign = center
    valign = center
}

# avatar (put an image at ~/.face)
image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = true
    placeholder_text = <span foreground="##aaaaaa">Password</span>
    fail_text = Wrong password
    rounding = -1
    inner_color = rgba(20, 20, 24, 0.85)
    outer_color = rgba(60, 60, 70, 1.0)
    check_color = rgba(90, 160, 90, 1.0)
    fail_color = rgba(190, 70, 70, 1.0)
    font_color = rgba(235, 235, 235, 1.0)
    position = 0, -90
    halign = center
    valign = center
}

# current keyboard layout
label {
    monitor =
    text = cmd[update:200] niri msg keyboard-layouts | sed -n 's/^\* *[0-9]* *//p'
    font_size = 16
    color = rgba(255, 255, 255, 0.7)
    position = 0, -150
    halign = center
    valign = center
}
